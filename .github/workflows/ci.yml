name: CI

on:
  # Chạy khi push lên bất kỳ branch nào
  push:
    branches: [ "**" ]
  # Chạy khi có pull request vào bất kỳ branch nào
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest

    # Giới hạn thời gian chạy tối đa 30 phút, tránh treo vô hạn
    timeout-minutes: 30

    steps:
      # ────────────────────────────────────────────
      # 1. Lấy source code về runner
      # ────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Cần full token để bot có thể push code sau này
          token: ${{ secrets.GITHUB_TOKEN }}

      # ────────────────────────────────────────────
      # 2. Cài Java 25 (Early Access - Temurin)
      # ────────────────────────────────────────────
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          # Cache thư mục ~/.m2 để tái sử dụng dependencies giữa các lần chạy
          cache: maven

      # ────────────────────────────────────────────
      # 3. Cài Xvfb - màn hình ảo cho GUI test
      #    (cần thiết nếu project dùng Swing/JavaFX/AWT)
      # ────────────────────────────────────────────
      - name: Install Xvfb
        run: sudo apt-get install -y xvfb

      # ────────────────────────────────────────────
      # 4. Tải toàn bộ dependencies về cache
      #    Bỏ qua test ở bước này để tăng tốc
      # ────────────────────────────────────────────
      - name: Install dependencies
        run: mvn install -DskipTests --no-transfer-progress

      # ────────────────────────────────────────────
      # 5. Spotless - tự động format lại code Java
      #    Dùng Google Java Format, xóa import thừa,
      #    chuẩn hóa whitespace và newline cuối file
      # ────────────────────────────────────────────
      - name: Spotless apply
        run: mvn spotless:apply --no-transfer-progress

      # ────────────────────────────────────────────
      # 6. Commit code đã được format lại vào repo
      #    Nếu không có thay đổi thì bỏ qua
      #    [skip ci] để tránh trigger CI lần nữa
      # ────────────────────────────────────────────
      - name: Commit formatted code
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || (
            git commit -m "style: auto-format by Spotless [skip ci]" &&
            git push
          )

      # ────────────────────────────────────────────
      # 7. Chạy toàn bộ unit test
      #    xvfb-run tạo màn hình ảo cho GUI components
      #    headless=true là fallback phòng khi Xvfb lỗi
      # ────────────────────────────────────────────
      - name: Run tests
        run: xvfb-run -a mvn test "-Djava.awt.headless=true" --no-transfer-progress

      # ────────────────────────────────────────────
      # 8. Upload kết quả test để xem báo cáo sau
      #    if: always() để chạy kể cả khi test fail
      # ────────────────────────────────────────────
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/
          retention-days: 7

      # ────────────────────────────────────────────
      # 9. Đóng gói thành file JAR
      #    Bỏ qua test vì đã chạy ở bước 7 rồi
      # ────────────────────────────────────────────
      - name: Build JAR
        run: mvn package -DskipTests --no-transfer-progress

      # ────────────────────────────────────────────
      # 10. Copy JAR vào thư mục release/ trong repo
      # ────────────────────────────────────────────
      - name: Copy JAR to release/
        run: |
          mkdir -p release
          cp target/*.jar release/

      # ────────────────────────────────────────────
      # 11. Commit file JAR mới vào nhánh hiện tại
      #     Nếu JAR không đổi (build giống hệt) thì bỏ qua
      # ────────────────────────────────────────────
      - name: Commit release JAR
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add release/
          git diff --staged --quiet || (
            git commit -m "release: update JAR [skip ci]" &&
            git push
          )