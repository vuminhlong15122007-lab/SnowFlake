name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Install dependencies
        run: mvn install -DskipTests --no-transfer-progress

      # Ubuntu không có màn hình thật => cần Xvfb
      - name: Run tests on Ubuntu with virtual display
        if: runner.os == 'Linux'
        run: xvfb-run -a mvn test -Djava.awt.headless=true --no-transfer-progress

      # Windows/macOS giữ gần như cũ
      - name: Run tests on Windows/macOS
        if: runner.os != 'Linux'
        run: mvn test -Djava.awt.headless=true --no-transfer-progress