name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest , windows-latest , macos-latest]
    runs-on: ${{matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Run tests (headless, skip JavaFX GUI)
        run: mvn test -Djava.awt.headless=true -Dtestfx.headless=true --no-transfer-progress